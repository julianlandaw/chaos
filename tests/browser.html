<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaos Lab — browser checks</title>
<style>body{font:14px system-ui;margin:24px;background:#f6f5ef;color:#28332d;padding-right:75%}h1{font-size:24px}li{padding:4px 0}.pass{color:#27733e}.fail{color:#b1402e}iframe{position:fixed;left:27%;top:0;width:1280px;height:100vh;border:1px solid #ccc;max-width:73%}pre{white-space:pre-wrap}</style>
<h1>Chaos Lab browser checks</h1><p id="status">Running numerical and interaction checks…</p><ol id="results"></ol>
<iframe id="lab" title="Chaos Lab under test" src="../docs/index.html"></iframe>
<script src="fixtures/lr1-reference.js"></script>
<script>
"use strict";
const results = document.getElementById("results");
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const assert = (condition, message) => { if (!condition) throw new Error(message); };
let passed = 0, failed = 0;
async function test(name, run) {
  const item = document.createElement("li");
  try { await run(); item.className = "pass"; item.textContent = `PASS: ${name}`; passed++; }
  catch (error) { item.className = "fail"; item.textContent = `FAIL: ${name} — ${error.message}`; failed++; }
  results.append(item);
}
async function runChecks() {
  const frame = document.getElementById("lab"), win = frame.contentWindow, doc = frame.contentDocument;
  const $ = id => doc.getElementById(id), M = win.ChaosMath;
  const errors = [];
  win.addEventListener("error", event => errors.push(event.message));
  win.addEventListener("unhandledrejection", event => errors.push(String(event.reason)));
  const click = selector => doc.querySelector(selector).click();
  async function until(condition, timeout = 60000) {
    const started = performance.now();
    while (!condition()) { if (performance.now() - started > timeout) throw new Error("Timed out waiting for simulation"); await wait(40); }
  }
  function input(id, value, type = "input") { $(id).value = value; $(id).dispatchEvent(new win.Event(type, { bubbles: true })); }
  const p = { m1: 1, m2: 1, l1: 1, l2: 1, g: 9.81 };
  const initial = [120 * Math.PI / 180, 0, -20 * Math.PI / 180, 0];
  function integrate(y, duration, dt, parameters = p, derivative = M.doubleDerivative) {
    for (let n = 0; n < Math.round(duration / dt); n++) y = M.rk4(y, dt, derivative, parameters);
    return y;
  }
  await wait(100);
  await test("Page initializes without dependencies", () => assert(doc.body.dataset.ready === "true" && M, "Application did not initialize"));
  await test("Page assets use a consistent version to bypass stale cached scripts", () => {
    const assets = [...doc.querySelectorAll('script[src], link[rel="stylesheet"]')];
    const versions = assets.map(asset => new URL(asset.src || asset.href).searchParams.get("v"));
    assert(versions.every(Boolean) && new Set(versions).size === 1, "Unversioned or mixed-version page assets");
  });
  if (!M) { document.body.dataset.result = "FAIL"; return; }
  await test("Known logistic orbit and state bounds", () => {
    assert(M.logistic(4, .5) === 1 && M.logistic(4, 1) === 0, "Exact orbit is incorrect");
    for (let a = 0; a <= 4; a += .05) assert(M.orbit(a, .173, 1000).every(x => x >= 0 && x <= 1), "Orbit escaped [0,1]");
  });
  await test("Fixed point, period doubling, and chaotic Lyapunov estimate", () => {
    assert(Math.abs(M.orbit(2.8, .2, 500).pop() - (1 - 1 / 2.8)) < 1e-12, "Wrong stable fixed point");
    assert(M.analyzeLogistic(3.2, .2).period === 2, "Period 2 not detected");
    assert(M.analyzeLogistic(3.5, .2).period === 4, "Period 4 not detected");
    assert(Math.abs(M.analyzeLogistic(4, .123456789).lyapunov - Math.log(2)) < .02, "Expected lambda ≈ ln(2)");
    assert(M.analyzeLogistic(4, .5).behavior === "Unstable orbit", "Exceptional unstable cycle mislabeled");
    assert(M.analyzeLogistic(0, .2).lyapunov === -Infinity, "Zero derivative should give −infinity");
  });
  await test("Undriven pendulums remain at their equilibrium", () => {
    assert(integrate([0, 0, 0, 0], 2, 1 / 240).every(x => x === 0), "Double pendulum left equilibrium");
    assert(M.rk4([0, 0], 1 / 240, M.singleDerivative, p).every(x => x === 0), "Single pendulum left equilibrium");
  });
  await test("Single pendulum matches the small-amplitude analytical period", () => {
    const period = 2 * Math.PI * Math.sqrt(p.l1 / p.g), result = integrate([.01, 0], period, 1 / 240, p, M.singleDerivative);
    assert(Math.abs(result[0] - .01) < 1e-6 && Math.abs(result[1]) < .0002, `Wrong period: ${result}`);
  });
  await test("Coupled equations conserve energy with unequal masses and lengths", () => {
    const parameters = { m1: 1.7, m2: .8, l1: .7, l2: 1.3, g: 9.81 }, y = [.9, -.8, -1.2, 1.9];
    const f = M.doubleDerivative(y, parameters), e = 1e-6;
    const gradientAlongFlow = (M.energy(y.map((v, i) => v + e * f[i]), parameters) - M.energy(y.map((v, i) => v - e * f[i]), parameters)) / (2 * e);
    assert(Math.abs(gradientAlongFlow) < 1e-6, `Nonzero energy derivative: ${gradientAlongFlow}`);
  });
  await test("RK4 converges at fourth order", () => {
    const reference = integrate(initial, 1, 1 / 1920);
    const error = dt => Math.hypot(...integrate(initial, 1, dt).map((v, i) => v - reference[i]));
    const coarse = error(1 / 240), fine = error(1 / 480);
    assert(coarse / fine > 10 && coarse / fine < 24, `Unexpected convergence ratio ${coarse / fine}`);
  });
  await test("High-energy trajectory has low numerical energy drift over 30 seconds", () => {
    const e0 = M.energy(initial, p), y = integrate(initial, 30, 1 / 240);
    const relative = Math.abs(M.energy(y, p) - e0) / e0;
    assert(y.every(Number.isFinite) && relative < 1e-5, `Energy drift ${relative}`);
  });
  await test("Shortest rods and highest gravity remain numerically stable", () => {
    const parameters = { ...p, l1: .3, l2: .3, g: 25 };
    const e0 = M.energy(initial, parameters), y = integrate(initial, 10, 1 / 240, parameters);
    assert(y.every(Number.isFinite) && Math.abs(M.energy(y, parameters) - e0) / e0 < .001, "Extreme supported parameters are unstable");
  });
  await test("Bifurcation canvas contains computed data", () => {
    const canvas = $("logistic-canvas"), data = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
    let amberPixels = 0;
    for (let i = 0; i < data.length; i += 4) if (data[i] > 120 && data[i] > data[i + 1] * 1.15) amberPixels++;
    assert(amberPixels > 500, "Bifurcation plot appears empty");
  });
  await test("Growth control updates analysis and presets select period-2", async () => {
    input("growth", 2.8); await wait(40);
    assert($("growth-value").textContent === "2.800" && $("logistic-behavior").textContent === "Steady state", "Growth control is disconnected");
    click('[data-logistic-preset="3.2"]');
    assert($("logistic-pattern").textContent === "2-point cycle", "Preset failed");
    input("initial", .61); input("iterations", 80);
    assert($("initial-value").textContent === "0.610" && $("iterations-value").textContent === "80 steps", "Orbit controls failed");
  });
  await test("Clicking the bifurcation chart selects a growth rate", async () => {
    const canvas = $("logistic-canvas"), rect = canvas.getBoundingClientRect();
    canvas.dispatchEvent(new win.PointerEvent("pointerdown", { pointerId: 1, pointerType: "touch", clientX: rect.left + rect.width * .7, clientY: rect.top + 150, bubbles: true }));
    canvas.dispatchEvent(new win.PointerEvent("pointerup", { pointerId: 1, pointerType: "touch", clientX: rect.left + rect.width * .7, clientY: rect.top + 150, bubbles: true }));
    await wait(40);
    assert(Number($("growth").value) > 3.3 && Number($("growth").value) < 3.8, "Click did not set a");
  });
  await test("Nearby-start comparison opens the time series and orbit playback works", async () => {
    $("logistic-compare").click(); await wait(40);
    assert(doc.querySelector('[data-logistic-view="series"]').getAttribute("aria-selected") === "true", "Comparison did not select time series");
    $("logistic-play").click(); await wait(200); $("logistic-play").click();
    const n = Number($("orbit-progress").textContent.split("=")[1]);
    assert(n > 0 && n < 80, `Orbit did not animate: n=${n}`);
    $("logistic-step").click(); await wait(40);
    assert(Number($("orbit-progress").textContent.split("=")[1]) === n + 1, "Step did not advance exactly once");
    click('[data-logistic-view="cobweb"]'); await wait(40);
    assert($("logistic-caption").textContent.includes("60 steps"), "Cobweb view failed");
  });
  await test("Arrow keys navigate experiment tabs", async () => {
    $("logistic-tab").dispatchEvent(new win.KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true })); await wait(40);
    assert($("logistic-panel").hidden && !$("pendulum-panel").hidden && $("pendulum-tab").getAttribute("aria-selected") === "true", "Tab keyboard navigation failed");
  });
  await test("Pendulum plays, pauses, and advances one fixed frame", async () => {
    $("pendulum-play").click(); await wait(250); $("pendulum-play").click();
    const time = Number.parseFloat($("pendulum-time").textContent); assert(time > 0, "Pendulum did not advance");
    await wait(80); assert(Number.parseFloat($("pendulum-time").textContent) === time, "Pause did not stop time");
    $("pendulum-step").click();
    assert(Math.abs(Number.parseFloat($("pendulum-time").textContent) - time - 1 / 60) < .011, "Step duration is wrong");
    assert(Number.parseFloat($("pendulum-energy").textContent) < .01, "UI energy drift is too high");
  });
  await test("Pendulum parameters restart the model and reject invalid lengths", () => {
    input("angle1", 45); assert($("angle1-value").textContent === "45°" && Number.parseFloat($("pendulum-time").textContent) === 0, "Angle control failed");
    input("length1", 0, "change"); assert(Number($("length1").value) === 1, "Invalid zero length was accepted");
    input("length1", 1.5, "change"); input("gravity", 1.62, "change");
    assert(Number($("length1").value) === 1.5 && Number($("gravity").value) === 1.62, "Physical settings did not apply");
    $("pendulum-compare").click(); assert($("pendulum-separation").textContent === "—", "Comparison did not disable");
    $("pendulum-trails").click(); click('[data-pendulum-view="phase"]');
    assert($("pendulum-caption").textContent.includes("Angles wrap"), "Phase portrait did not open");
  });
  await test("Switching experiments pauses playback", async () => {
    $("pendulum-play").click(); await wait(80); $("logistic-tab").click(); await wait(80); $("pendulum-tab").click();
    const time = $("pendulum-time").textContent; await wait(80);
    assert($("pendulum-time").textContent === time && $("pendulum-state").textContent.includes("PAUSED"), "Hidden experiment kept running");
  });
  await test("Field-note actions open the matching experiments", async () => {
    click('[data-note-action="fork"]'); await wait(40);
    assert(!$("logistic-panel").hidden && $("growth").value === "3.2", "Period-2 note action failed");
    click('[data-note-action="sensitivity"]'); await wait(40);
    assert(!$("pendulum-panel").hidden && $("pendulum-compare").checked && $("angle1").value === "120", "Sensitivity note action failed");
    click('[data-note-action="phase"]'); await wait(40);
    assert(doc.querySelector('[data-pendulum-view="phase"]').getAttribute("aria-selected") === "true" && $("angle1").value === "15", "Phase note action failed");
    if ($("pendulum-state").textContent === "SIMULATION RUNNING") $("pendulum-play").click();
  });
  await test("PNG export creates a downloadable plot", async () => {
    const originalClick = win.HTMLAnchorElement.prototype.click; let download;
    win.HTMLAnchorElement.prototype.click = function() { download = { name: this.download, href: this.href }; };
    try { click('[data-canvas="pendulum-canvas"]'); await wait(100); assert(download && download.name.endsWith(".png") && download.href.startsWith("blob:"), "PNG download not created"); }
    finally { win.HTMLAnchorElement.prototype.click = originalClick; }
  });
  await test("Mobile layout fits a 360px viewport in both experiments", async () => {
    frame.style.width = "360px"; await wait(100);
    for (const name of ["logistic", "pendulum"]) {
      $(`${name}-tab`).click(); await wait(80);
      assert(doc.documentElement.scrollWidth <= win.innerWidth + 1, `${name} overflows: ${doc.documentElement.scrollWidth} > ${win.innerWidth}`);
      const canvas = $(`${name}-canvas`), rect = canvas.getBoundingClientRect(); assert(rect.width > 200 && rect.width <= win.innerWidth, `${name} canvas has wrong size`);
    }
  });
  await test("Reset restores logistic defaults", () => {
    $("logistic-tab").click(); $("logistic-reset").click();
    assert($("growth").value === "3.7" && $("initial").value === "0.2" && $("iterations").value === "120" && !$("logistic-compare").checked, "Defaults were not restored");
    assert(doc.querySelector('[data-logistic-view="bifurcation"]').getAttribute("aria-selected") === "true", "Reset did not restore bifurcation view");
  });
  const Cardiac = win.CardiacSimulation;
  const cardiacResults = {};
  await test("Original LR1 model handles its removable voltage singularities", () => {
    assert(doc.body.dataset.cardiacReady === "true", "Cardiac lab did not initialize");
    for (const v of [-47.13, -77]) {
      const cell = new win.LR1CellIto(); cell.v = v; cell.stepdt(0);
      assert([cell.v, cell.m, cell.xr, cell.cai].every(Number.isFinite), `Nonfinite state at ${v} mV`);
    }
  });
  await test("Cardiac parameter validation rejects unsupported pacing and currents", () => {
    for (const invalid of [{ pcl: 99 }, { pcl: 378.5 }, { beats: 101 }, { tauXfac: 0 }, { icalfac: NaN }]) {
      let rejected = false;
      try { Cardiac.validate({ ...Cardiac.PRESETS.chaos, ...invalid }); } catch (_) { rejected = true; }
      assert(rejected, `Invalid parameters accepted: ${JSON.stringify(invalid)}`);
    }
  });
  for (const preset of ["regular", "chaos", "eads"]) await test(`Cardiac ${preset} preset matches original simulator reference`, async () => {
    const result = await Cardiac.run(Cardiac.PRESETS[preset]); cardiacResults[preset] = result;
    const reference = LR1_REFERENCE[preset];
    for (const key of ["apds", "xsInit", "eadCounts", "stimulusTimes"]) {
      assert(result[key].length === reference[key].length, `${key} count differs`);
      const tolerance = key === "xsInit" ? 1e-8 : .011;
      result[key].forEach((value, i) => assert(Math.abs(value - reference[key][i]) <= tolerance, `${key}[${i}] differs from original`));
    }
    assert(result.vs.length === result.ts.length && result.xs.length === result.ts.length && result.ts.length <= 30002, "Invalid sampled trace sizes");
    assert(result.vs.every(Number.isFinite) && result.xs.every(Number.isFinite), "Nonfinite plot data");
    assert(result.stimulusTimes.length === result.inputs.beats, "Incorrect stimulus count");
    result.stimulusTimes.slice(1).forEach((time, i) => assert(Math.abs(time - result.stimulusTimes[i] - result.inputs.pcl) < 1e-8, "Pacing clock drift"));
    if (preset === "regular") assert(result.metrics.maxAPD - result.metrics.minAPD < .02 && result.metrics.totalEADs === 0, "Regular rhythm did not settle");
    if (preset === "chaos") assert(result.metrics.maxAPD - result.metrics.minAPD > 200 && new Set(result.apds.map(x => x.toFixed(1))).size > 10, "Chaos preset lost its varied APDs");
    if (preset === "eads") assert(result.metrics.totalEADs >= 1, "EAD preset lost its secondary voltage rise");
  });
  await test("Cooperative cardiac calculation can be aborted without blocking the page", async () => {
    const controller = new win.AbortController(); let timerFired = false;
    const promise = Cardiac.run(Cardiac.PRESETS.chaos, { signal: controller.signal });
    setTimeout(() => { timerFired = true; controller.abort(); }, 15);
    let aborted = false;
    try { await promise; } catch (error) { aborted = error.name === "AbortError"; }
    assert(timerFired && aborted, "Cooperative run could not be canceled");
  });
  await test("Cardiac tab computes the original chaos preset and selects the appropriate engine", async () => {
    $("cardiac-tab").click();
    assert($("pendulum-panel").hidden && $("logistic-panel").hidden && !$("cardiac-panel").hidden, "Three-way panel switching failed");
    await until(() => $("cardiac-panel").dataset.state !== "running");
    assert($("cardiac-panel").dataset.state === "complete", $("cardiac-status").textContent);
    assert($("cardiac-count").textContent === "50 / 50", "UI did not finish the chaos preset");
    assert($("cardiac-panel").dataset.engine === (win.location.protocol === "file:" ? "cooperative" : "worker"), "Unexpected cardiac compute engine");
  });
  await test("All four cardiac plots render data and support keyboard navigation", async () => {
    for (const view of ["voltage", "apd", "return", "memory"]) {
      click(`[data-cardiac-view="${view}"]`); await wait(30);
      const canvas = $("cardiac-canvas"), data = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
      let amber = 0;
      for (let i = 0; i < data.length; i += 4) if (data[i] > 120 && data[i] > data[i + 1] * 1.15) amber++;
      assert(amber > 40, `${view} plot is empty`);
      assert($("cardiac-plot-panel").getAttribute("aria-labelledby") === `cardiac-${view}-tab`, "Plot tab label mismatch");
    }
    $("cardiac-memory-tab").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Home", bubbles: true }));
    assert($("cardiac-voltage-tab").getAttribute("aria-selected") === "true", "Cardiac tab keyboard navigation failed");
    input("cardiac-window", "all", "change");
  });
  await test("Changed cardiac controls mark the old run and exports preserve its original parameters", async () => {
    input("cardiac-pcl", 400);
    assert($("cardiac-panel").dataset.stale === "true" && $("cardiac-corner").textContent.includes("PREVIOUS RUN"), "Outdated plots are not labelled");
    const originalClick = win.HTMLAnchorElement.prototype.click; const downloads = [];
    win.HTMLAnchorElement.prototype.click = function() {
      downloads.push({ name: this.download, href: this.href, content: this.download.endsWith(".csv") ? win.fetch(this.href).then(r => r.text()) : null });
    };
    try {
      $("cardiac-csv").click(); click('[data-canvas="cardiac-canvas"]');
      await until(() => downloads.length === 2, 3000);
      const csv = await downloads.find(item => item.name.endsWith(".csv")).content;
      const rows = csv.trim().split(/\r?\n/).map(row => row.split(","));
      assert(rows.length === 51 && rows[0].includes("xr_at_upstroke"), "CSV omitted measurements");
      assert(rows[1][rows[0].indexOf("pcl")] === "378", "CSV used edited controls instead of recorded parameters");
      assert(downloads.some(item => item.name === "chaos-lab-cardiac-voltage.png"), "Cardiac PNG filename is wrong");
    } finally { win.HTMLAnchorElement.prototype.click = originalClick; }
  });
  await test("Cardiac cancellation preserves completed data and rejects late results", async () => {
    $("cardiac-run").click(); await wait(30); $("cardiac-run").click(); await wait(80);
    assert($("cardiac-progress").hidden && $("cardiac-status").textContent.includes("canceled"), "Cancel did not stop the run");
    assert($("cardiac-count").textContent === "50 / 50" && $("cardiac-panel").dataset.stale === "true", "Cancellation replaced the previous data");
    $("cardiac-run").click(); $("logistic-tab").click(); await wait(80);
    assert($("cardiac-progress").hidden && $("cardiac-status").textContent.includes("leaving"), "Hidden cardiac experiment kept computing");
    click("[data-cardiac-note]");
    assert(!$("cardiac-panel").hidden && $("cardiac-panel").dataset.state !== "running", "Field note restarted a canceled run unexpectedly");
  });
  await test("Cardiac presets apply all original parameters and EAD counts reach the UI", async () => {
    click('[data-cardiac-preset="eads"]');
    assert($("cardiac-pcl").value === "1575" && $("cardiac-tauXfac").value === "10" && $("cardiac-itofac").value === "0", "EAD preset parameters are wrong");
    await until(() => $("cardiac-panel").dataset.state !== "running");
    assert($("cardiac-panel").dataset.state === "complete" && Number($("cardiac-eads").textContent) >= 1, "EAD result did not reach UI");
    $("cardiac-reset").click();
    assert($("cardiac-pcl").value === "378" && $("cardiac-icalfac").value === "1.15" && $("cardiac-ikifac").value === "2.2" && $("cardiac-yshift").value === "8", "Reset did not restore the original chaos parameters");
    $("cardiac-run").click();
    input("cardiac-tauXfac", 7.1); input("cardiac-itofac", 2); input("cardiac-beats", 20);
    assert($("cardiac-tauXfac-value").textContent === "7.1×" && $("cardiac-itofac-value").textContent === "2.00×" && $("cardiac-beats-value").textContent === "20", "Cardiac sliders are disconnected");
    input("cardiac-icalfac", 9, "change"); $("cardiac-run").click();
    assert($("cardiac-panel").dataset.state !== "running" && $("cardiac-status").textContent.includes("valid"), "Invalid current multiplier was accepted");
    input("cardiac-icalfac", 1.15, "change");
  });
  await test("All three experiments fit phone widths and expanded cardiac controls", async () => {
    for (const width of [320, 390]) {
      frame.style.width = `${width}px`; await wait(70);
      for (const name of ["logistic", "pendulum", "cardiac"]) {
        $(`${name}-tab`).click(); await wait(40);
        if (name === "cardiac") doc.querySelector(".cardiac-parameters").open = true;
        assert(doc.documentElement.scrollWidth <= win.innerWidth + 1, `${name} overflows at ${width}px`);
      }
    }
    click('a[href="#cardiac-model-notes"]');
    assert($("cardiac-model-notes").querySelector("details").open, "Cardiac model notes did not open");
    assert(doc.documentElement.scrollWidth <= win.innerWidth + 1, "Expanded model notes overflow the viewport");
  });
  await test("A missing core script shows a refresh message instead of crashing the cardiac lab", async () => {
    const failureFrame = document.createElement("iframe"); failureFrame.hidden = true;
    document.body.append(failureFrame);
    try {
      const failureDoc = failureFrame.contentDocument;
      const cardiacScript = doc.querySelector('script[src*="cardiac-lab.js"]').src;
      failureDoc.open();
      failureDoc.write('<!doctype html><html><head></head><body>' + doc.body.innerHTML + '<script>window.loadErrors=[];window.addEventListener("error",function(event){window.loadErrors.push(event.message);});<\/script><script src="' + cardiacScript + '"><\/script></body></html>');
      failureDoc.close();
      await until(() => failureDoc.getElementById("cardiac-panel").dataset.state === "error", 3000);
      assert(failureFrame.contentWindow.loadErrors.length === 0, "Missing core still produces an uncaught error");
      assert(failureDoc.getElementById("cardiac-status").textContent.includes("Refresh"), "Missing core has no recovery instruction");
      assert(failureDoc.getElementById("cardiac-run").disabled, "Broken controls are still enabled");
      failureDoc.getElementById("logistic-tab").click();
      assert(failureDoc.getElementById("cardiac-panel").hidden, "Error panel did not hide on navigation");
      failureDoc.getElementById("cardiac-tab").click();
      assert(!failureDoc.getElementById("cardiac-panel").hidden, "Recovery message is unreachable");
    } finally { failureFrame.remove(); }
  });
  await test("No JavaScript errors during interaction", () => assert(errors.length === 0, errors.join("; ")));
  document.getElementById("status").textContent = `${failed ? "FAIL" : "PASS"}: ${passed} passed, ${failed} failed.`;
  document.body.dataset.result = failed ? "FAIL" : "PASS";
  document.body.dataset.passed = passed;
  document.body.dataset.failed = failed;
}
const labFrame = document.getElementById("lab");
if (labFrame.contentDocument?.body?.dataset.cardiacReady === "true") runChecks();
else labFrame.addEventListener("load", runChecks, { once: true });
</script>
</html>
